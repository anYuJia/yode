[workspace]
members = [
    "apps/yode-desktop/src-tauri",
    "crates/yode-core",
    "crates/yode-llm",
    "crates/yode-tools",
    "crates/yode-mcp",
    "crates/yode-agent",
    "crates/yode-runtime",
    "crates/yode-evals",
    "crates/yode-index",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "A desktop-first AI coding agent runtime built with Rust"
repository = "https://github.com/anYuJia/yode"
readme = "README.md"
keywords = ["ai", "assistant", "desktop", "rust", "llm"]
categories = ["development-tools"]

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
futures = "0.3"
tokio-tungstenite = "0.28"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
html2text = "0.14"

# Checksum
sha2 = "0.10"

# MCP
rmcp = { version = "1.4", features = ["client", "server", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest"] }

# YAML (for skill frontmatter)
serde_yaml_ng = "0.10"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Utils
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
globset = "0.4"
dirs = "6"
similar = "2"
base64 = "0.22"
parking_lot = "0.12"
fs2 = "0.4"

# Internal crates
yode-core = { version = "1.0.0", path = "crates/yode-core" }
yode-llm = { version = "1.0.0", path = "crates/yode-llm" }
yode-tools = { version = "1.0.0", path = "crates/yode-tools" }
yode-mcp = { version = "1.0.0", path = "crates/yode-mcp" }
yode-agent = { version = "1.0.0", path = "crates/yode-agent" }
yode-runtime = { version = "1.0.0", path = "crates/yode-runtime" }
yode-evals = { version = "1.0.0", path = "crates/yode-evals" }
yode-index = { version = "1.0.0", path = "crates/yode-index" }
