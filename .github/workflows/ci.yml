name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    name: Rust Check And Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # pinned action commit
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (workspace, all targets, deny warnings)
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

      - name: Cargo check (workspace, all targets)
        run: cargo check --workspace --all-targets

      - name: Workspace tests
        run: cargo test --workspace

      - name: Install cargo-audit
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          tool: cargo-audit

      - name: Cargo audit
        run: cargo audit

      - name: Provider integration tests
        run: cargo test -p yode-llm --test anthropic_integration

      - name: Artifact smoke verification
        run: bash scripts/verify-compact-artifacts.sh

  test-matrix:
    name: Workspace Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # pinned action commit
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Apply Windows Codex compatibility patch
        if: runner.os == 'Windows'
        run: python scripts/fix_codex_windows_compat.py

      - name: Format patched Windows source
        if: runner.os == 'Windows'
        run: cargo fmt --all

      - name: Codex compatibility tests
        if: runner.os == 'Windows'
        run: cargo test -p yode-tools codex_compat::tests::

      - name: Workspace tests
        run: cargo test --workspace

      - name: Emit validated Codex source
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -c "import base64,pathlib; print('YODE_CODEX_B64='+base64.b64encode(pathlib.Path('crates/yode-tools/src/builtin/codex_compat.rs').read_bytes()).decode())"

  desktop-frontend:
    name: Desktop Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10
          run_install: false

      - name: Install frontend dependencies
        working-directory: apps/yode-desktop
        run: pnpm install --frozen-lockfile

      - name: Frontend tests
        working-directory: apps/yode-desktop
        run: pnpm test

      - name: Frontend build
        working-directory: apps/yode-desktop
        run: pnpm build

      - name: Production dependency audit
        working-directory: apps/yode-desktop
        run: pnpm audit --prod --registry=https://registry.npmjs.org

  parity-snapshot:
    name: Parity Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # pinned action commit
        with:
          toolchain: stable

      - name: Install parity audit tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Run parity snapshot CI
        run: |
          bash scripts/parity-snapshot-ci.sh
          bash scripts/parity-snapshot-metadata-report.sh .yode/benchmarks
          bash scripts/parity-visual-report.sh .yode/benchmarks/output-regression-snapshot.md .yode/benchmarks/output-regression-snapshot.md .yode/benchmarks/visual-diff-report.md
          bash scripts/parity-visual-width-report.sh .yode/benchmarks/output-regression-snapshot.md .yode/benchmarks/visual-width-report.md

      - name: Build parity artifact bundle
        if: always()
        run: bash scripts/parity-artifact-bundle.sh .yode/parity-artifacts

      - name: Upload parity snapshot artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parity-snapshot-artifacts
          path: .yode/parity-artifacts

  parity-replay:
    name: Parity Replay
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # pinned action commit
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Run parity replay CI
        run: |
          bash scripts/parity-replay-ci.sh
          bash scripts/parity-replay-storage-ci.sh
          bash scripts/parity-replay-index-ci.sh
          bash scripts/parity-failure-upload-route.sh 055 > .yode/benchmarks/failure-route-report.md

      - name: Build parity artifact bundle
        if: always()
        run: bash scripts/parity-artifact-bundle.sh .yode/parity-artifacts

      - name: Upload parity replay artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parity-replay-artifacts
          path: .yode/parity-artifacts

  parity-visual-docs:
    name: Parity Visual And Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # pinned action commit
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Run parity visual and docs CI
        run: |
          bash scripts/parity-visual-ci.sh || true
          bash scripts/parity-docs-ci.sh || true
          bash scripts/parity-workflow-audit.sh || true

      - name: Build parity artifact bundle
        if: always()
        run: bash scripts/parity-artifact-bundle.sh .yode/parity-artifacts

      - name: Upload parity visual docs artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parity-visual-docs-artifacts
          path: .yode/parity-artifacts
