name: Temporary Clippy Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
      - name: Make lock-file open semantics explicit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/yode-core/src/learning.rs')
          text = path.read_text()
          old = '''        let lock = OpenOptions::new()\n            .create(true)\n            .read(true)\n            .write(true)'''
          new = '''        let lock = OpenOptions::new()\n            .create(true)\n            .truncate(false)\n            .read(true)\n            .write(true)'''
          if old not in text:
              raise SystemExit('target lock OpenOptions block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/yode-core/src/learning.rs
          git commit -m 'fix(learning): make lock open semantics explicit'
          git push origin HEAD:main
