name: Temporary Ubuntu Sandbox Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Patch bubblewrap capability detection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/yode-tools/src/sandbox.rs')
          text = path.read_text()

          old_imports = '''use std::env;\nuse std::path::{Path, PathBuf};\n'''
          new_imports = '''use std::env;\nuse std::path::{Path, PathBuf};\n#[cfg(target_os = "linux")]\nuse std::process::Command as StdCommand;\n#[cfg(target_os = "linux")]\nuse std::sync::OnceLock;\n'''
          if old_imports not in text:
              raise SystemExit('sandbox import anchor not found')
          text = text.replace(old_imports, new_imports, 1)

          old_linux = '''    #[cfg(target_os = "linux")]\n    if let Some(bwrap) = find_executable("bwrap") {\n        let cwd = working_dir\n            .canonicalize()\n            .unwrap_or_else(|_| working_dir.to_path_buf());\n        let mut args = vec![\n            "--die-with-parent".to_string(),\n            "--new-session".to_string(),\n            "--ro-bind".to_string(),\n            "/".to_string(),\n            "/".to_string(),\n            "--bind".to_string(),\n            cwd.display().to_string(),\n            cwd.display().to_string(),\n            "--chdir".to_string(),\n            cwd.display().to_string(),\n            "--proc".to_string(),\n            "/proc".to_string(),\n            "--dev".to_string(),\n            "/dev".to_string(),\n            "--tmpfs".to_string(),\n            "/tmp".to_string(),\n        ];\n        if network == SandboxNetworkPolicy::Deny {\n            args.push("--unshare-net".to_string());\n        }\n        args.extend([\n            "--".to_string(),\n            "sh".to_string(),\n            "-c".to_string(),\n            command.to_string(),\n        ]);\n        return Ok(PreparedShell {\n            executable: bwrap,\n            args,\n            info: SandboxLaunchInfo {\n                mode,\n                backend: SandboxBackend::Bubblewrap,\n                sandboxed: true,\n                network,\n                degraded_reason: None,\n            },\n        });\n    }\n'''
          new_linux = '''    #[cfg(target_os = "linux")]\n    let linux_bwrap_error = match usable_bwrap() {\n        Ok(bwrap) => {\n            let cwd = working_dir\n                .canonicalize()\n                .unwrap_or_else(|_| working_dir.to_path_buf());\n            let mut args = vec![\n                "--die-with-parent".to_string(),\n                "--new-session".to_string(),\n                "--ro-bind".to_string(),\n                "/".to_string(),\n                "/".to_string(),\n                "--bind".to_string(),\n                cwd.display().to_string(),\n                cwd.display().to_string(),\n                "--chdir".to_string(),\n                cwd.display().to_string(),\n                "--proc".to_string(),\n                "/proc".to_string(),\n                "--dev".to_string(),\n                "/dev".to_string(),\n                "--tmpfs".to_string(),\n                "/tmp".to_string(),\n            ];\n            if network == SandboxNetworkPolicy::Deny {\n                args.push("--unshare-net".to_string());\n            }\n            args.extend([\n                "--".to_string(),\n                "sh".to_string(),\n                "-c".to_string(),\n                command.to_string(),\n            ]);\n            return Ok(PreparedShell {\n                executable: bwrap,\n                args,\n                info: SandboxLaunchInfo {\n                    mode,\n                    backend: SandboxBackend::Bubblewrap,\n                    sandboxed: true,\n                    network,\n                    degraded_reason: None,\n                },\n            });\n        }\n        Err(reason) => reason,\n    };\n'''
          if old_linux not in text:
              raise SystemExit('linux sandbox anchor not found')
          text = text.replace(old_linux, new_linux, 1)

          old_reason = '''    let reason = platform_unavailable_reason();\n    if mode == SandboxMode::Strict {\n'''
          new_reason = '''    #[cfg(target_os = "linux")]\n    let reason = linux_bwrap_error;\n    #[cfg(not(target_os = "linux"))]\n    let reason = platform_unavailable_reason();\n    if mode == SandboxMode::Strict {\n'''
          if old_reason not in text:
              raise SystemExit('sandbox reason anchor not found')
          text = text.replace(old_reason, new_reason, 1)

          helper_anchor = '''fn platform_unavailable_reason() -> String {\n'''
          helpers = r'''#[cfg(target_os = "linux")]
static BWRAP_PROBE: OnceLock<Result<PathBuf, String>> = OnceLock::new();

#[cfg(target_os = "linux")]
fn usable_bwrap() -> Result<PathBuf, String> {
    BWRAP_PROBE
        .get_or_init(|| resolve_bwrap_candidate(find_executable("bwrap"), probe_bwrap))
        .clone()
}

#[cfg(target_os = "linux")]
fn resolve_bwrap_candidate<F>(candidate: Option<PathBuf>, probe: F) -> Result<PathBuf, String>
where
    F: FnOnce(&Path) -> Result<(), String>,
{
    let bwrap = candidate
        .ok_or_else(|| "bubblewrap (bwrap) is not installed or not on PATH".to_string())?;
    probe(&bwrap)?;
    Ok(bwrap)
}

#[cfg(target_os = "linux")]
fn probe_bwrap(bwrap: &Path) -> Result<(), String> {
    let output = StdCommand::new(bwrap)
        .args([
            "--die-with-parent",
            "--new-session",
            "--ro-bind",
            "/",
            "/",
            "--proc",
            "/proc",
            "--dev",
            "/dev",
            "--",
            "sh",
            "-c",
            "true",
        ])
        .output()
        .map_err(|error| format!("bubblewrap probe could not start: {error}"))?;
    if output.status.success() {
        return Ok(());
    }

    let stderr = String::from_utf8_lossy(&output.stderr);
    let detail = stderr
        .lines()
        .map(str::trim)
        .find(|line| !line.is_empty())
        .map(|line| line.chars().take(240).collect::<String>())
        .unwrap_or_else(|| format!("probe exited with {}", output.status));
    Err(format!("bubblewrap is installed but unusable: {detail}"))
}

'''
          if helper_anchor not in text:
              raise SystemExit('sandbox helper anchor not found')
          text = text.replace(helper_anchor, helpers + helper_anchor, 1)

          test_anchor = '''    #[test]\n    fn annotation_preserves_result_metadata() {\n'''
          test = '''    #[cfg(target_os = "linux")]\n    #[test]\n    fn unusable_bwrap_candidate_is_rejected_before_command_execution() {\n        let candidate = PathBuf::from("/usr/bin/bwrap");\n        let error = resolve_bwrap_candidate(Some(candidate), |_| {\n            Err("bubblewrap is installed but unusable: uid map denied".to_string())\n        })\n        .unwrap_err();\n        assert!(error.contains("unusable"));\n        assert!(error.contains("uid map denied"));\n    }\n\n'''
          if test_anchor not in text:
              raise SystemExit('sandbox test anchor not found')
          text = text.replace(test_anchor, test + test_anchor, 1)

          path.write_text(text)
          PY
          cargo fmt --all
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Verify yode-tools
        run: cargo test -p yode-tools --lib
      - name: Commit production fix
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/yode-tools/src/sandbox.rs
          git commit -m "fix(sandbox): detect unusable bubblewrap backends"
          git push origin HEAD:main
