name: Fix Codex Windows Compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-codex-windows.yml'
      - 'scripts/fix_codex_windows_compat.py'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fix:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - name: Apply targeted patch
        run: python scripts/fix_codex_windows_compat.py
      - name: Format
        run: cargo fmt --all
      - name: Run Codex compatibility tests
        run: cargo test -p yode-tools codex_compat::tests::
      - name: Emit validated source blob
        shell: pwsh
        run: |
          python -c "import base64,pathlib; print('YODE_CODEX_B64='+base64.b64encode(pathlib.Path('crates/yode-tools/src/builtin/codex_compat.rs').read_bytes()).decode())"
