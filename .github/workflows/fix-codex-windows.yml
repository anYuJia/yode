name: Fix Codex Windows Compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-codex-windows.yml'
      - 'scripts/fix_codex_windows_compat.py'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fix:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - name: Apply targeted patch
        run: python scripts/fix_codex_windows_compat.py
      - name: Format
        run: cargo fmt --all
      - name: Run Codex compatibility tests
        run: cargo test -p yode-tools codex_compat::tests::
      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/yode-tools/src/builtin/codex_compat.rs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "fix(codex): make shell compatibility tests cross-platform"
          git push origin HEAD:main
