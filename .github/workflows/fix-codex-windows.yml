name: Fix Codex Windows Compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-codex-windows.yml'
      - 'scripts/fix_codex_windows_compat.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Apply targeted patch
        run: python scripts/fix_codex_windows_compat.py
      - name: Format
        run: cargo fmt --all
      - name: Run Codex compatibility tests
        run: cargo test -p yode-tools codex_compat::tests::
      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/yode-tools/src/builtin/codex_compat.rs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "fix(codex): make shell compatibility tests cross-platform"
          git push origin HEAD:main
