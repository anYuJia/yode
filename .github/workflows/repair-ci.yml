name: One-shot CI Repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Repair portable tests and formatting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/yode-runtime/src/execution_backend.rs')
          text = path.read_text()
          old = 'command: "printf yode".to_string(),'
          new = 'command: "echo yode".to_string(),'
          if old not in text:
              raise SystemExit('expected execution backend test command not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git rm .github/workflows/repair-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ci): normalize cross-platform runtime tests"
          git push origin HEAD:main
