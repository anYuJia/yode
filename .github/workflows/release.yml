name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # RELEASE-001：发布前在同一 tag commit 上重跑完整质量门禁。
  # 该 job 失败时不应继续 publish（通过 publish 的 needs 依赖强制）。
  quality-gate:
    name: Release Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Workspace tests
        run: cargo test --workspace

      - name: Install cargo-audit
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          tool: cargo-audit

      - name: Cargo audit
        run: cargo audit

  publish:
    name: Build App ${{ matrix.display_name }}
    runs-on: ${{ matrix.runner }}
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            display_name: Linux x86_64
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            display_name: macOS Intel
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            display_name: macOS Apple Silicon
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            display_name: Windows x86_64
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          targets: ${{ matrix.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/yode-desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/yode-desktop
        run: |
          pnpm install --frozen-lockfile

      - name: Build and publish desktop app
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/yode-desktop
          tagName: ${{ github.ref_name }}
          releaseName: Yode Desktop ${{ github.ref_name }}
          releaseBody: "Yode 桌面应用发布。"
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
