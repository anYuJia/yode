# Yode 默认配置

[llm]
# 默认 LLM 提供商和模型
default_provider = "openai"
default_model = "gpt-4o"

[llm.providers.openai]
format = "openai"
base_url = "https://api.openai.com/v1"

[llm.providers.anthropic]
format = "anthropic"
base_url = "https://api.anthropic.com"

[tools]
# Bash 工具超时（秒）
bash_timeout = 120
# 需要确认的工具列表
require_confirmation = ["bash", "write_file", "edit_file"]

[budget]
# 单轮硬预算：达到上限会暂停本轮，由用户决定续批或停止。
# 每轮最大工具调用次数（0 = 不限）
max_tool_calls = 40
# 每轮最大 LLM 循环步数（0 = 不限）
max_steps = 0
# 每轮最大墙钟时间（秒，0 = 不限）
max_wall_secs = 0

[session]
# 会话数据库路径（空则使用默认 ~/.yode/sessions.db）
db_path = ""

[ui]
# 语言：zh-CN, en
language = "zh-CN"
# 主题：dark, light
theme = "dark"

[update]
# Desktop 更新策略预留。当前版本只检查 GitHub Releases，不在应用内替换二进制。
# 未来接入签名 Tauri updater 后可复用此配置。
auto_check = true
# 当前必须保持 false：禁止恢复旧 CLI updater 的后台下载/二进制替换路径。
auto_download = false
